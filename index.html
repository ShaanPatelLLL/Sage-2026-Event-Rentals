<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPJ - Sage 2026 Event Rentals</title>
<link rel="icon" href="https://www.gpj.com/wp-content/uploads/2022/07/cropped-GPJ-Logo-1-270x270.png">
<style>
  :root {
    --ink: #111111;
    --paper: #f7f7f7;
    --panel: #ffffff;
    --line: #e2e2e2;
    --muted: #6b6b6b;
    --accent: #111111;
    --accent-dark: #000000;
    --sidebar-bg: #0a0a0a;
    --sidebar-ink: #ffffff;
    --sidebar-muted: #9a9a9a;
    --sidebar-line: #262626;
    --green-bg: #e6f4ea;
    --green-text: #1e7a34;
    --green-dot: #2fa84a;
    --radius: 4px;
    --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-body: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  body { display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-line);
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  #sidebar-logo {
    display: block;
    height: 26px;
    margin-bottom: 18px;
  }
  #sidebar h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 2px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--sidebar-ink);
  }
  #sidebar .sub {
    font-size: 12px;
    color: var(--sidebar-muted);
    margin-bottom: 20px;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin-bottom: 2px; }
  nav li.has-subs { display: flex; align-items: center; gap: 2px; }
  nav li.has-subs > a { flex: 1; min-width: 0; }
  .nav-toggle {
    background: none;
    border: none;
    color: var(--sidebar-muted);
    cursor: pointer;
    padding: 8px 10px;
    font-size: 10px;
    line-height: 1;
    border-radius: var(--radius);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .nav-toggle:hover { background: #1c1c1c; color: #fff; }
  .nav-toggle.expanded { transform: rotate(180deg); }
  nav a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: var(--radius);
    color: var(--sidebar-ink);
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
  }
  nav a:hover { background: #1c1c1c; }
  nav a.active { background: #fff; color: #000; }
  nav a .count { font-size: 11.5px; color: var(--sidebar-muted); }
  nav a.active .count { color: #555; }
  .sub-list { list-style: none; margin: 2px 0 6px 14px; padding: 0; border-left: 1px solid var(--sidebar-line); display: none; }
  .sub-list.expanded { display: block; }
  .sub-list a { font-size: 13.5px; padding: 7px 10px; }
  .sub-list .count { font-size: 11px; }
  #sidebar-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--sidebar-line);
    font-size: 11px;
    color: var(--sidebar-muted);
    line-height: 1.6;
  }
  #sidebar-footer a { color: var(--sidebar-muted); }

  /* Main */
  #main { flex: 1; padding: 28px 36px 60px; max-width: 1400px; }
  #topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  #search-wrap { position: relative; flex: 1; min-width: 260px; max-width: 480px; }
  #search {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 14.5px;
    background: #fff;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }
  select#sortSelect {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 14px;
    color: var(--ink);
  }
  #resultCount { font-size: 13px; color: var(--muted); white-space: nowrap; }

  #section-title {
    font-family: var(--font-display);
    font-size: 26px;
    margin: 0 0 4px;
  }
  #section-desc { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .imgwrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .noimg {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 10px;
  }
  .card .body { padding: 12px 13px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .title { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .card .dims { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card .tag {
    display: inline-block;
    font-size: 10.5px;
    color: var(--accent-dark);
    background: #f1ece2;
    padding: 2px 7px;
    border-radius: 999px;
    width: fit-content;
  }
  .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 13px; }
  .card .price { font-weight: 600; }
  .card .brand-note {
    font-size: 10.5px;
    color: var(--muted);
    font-style: italic;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    line-height: 1.4;
  }
  .stock {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--green-bg);
    color: var(--green-text);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .stock .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-dot); }
  .card .pid { font-size: 10.5px; color: var(--muted); }

  #empty { text-align: center; padding: 60px 20px; color: var(--muted); display: none; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    #sidebar { position: relative; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
    #main { padding: 20px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <img id="sidebar-logo" src="https://www.gpj.com/wp-content/themes/main/dist/images/logo-white_bd68dd36cfd4aca51e8e.svg" alt="GPJ">
  <h1>Inventory Board</h1>
  <nav id="nav"></nav>
</div>

<div id="main">
  <div id="topbar">
    <div id="search-wrap">
      <span id="search-icon">&#9906;</span>
      <input id="search" type="text" placeholder="Search all items...">
    </div>

      <option value="price-asc">Price (Low–High)</option>

    </select>
    <div id="resultCount"></div>
  </div>

  <h2 id="section-title">All Items</h2>
  <p id="section-desc"></p>

  <div id="grid"></div>
  <div id="empty">No items match your search.</div>
</div>

"tags": "communal"}];
const SECTIONS = ["Armchairs & Dining Chairs", "Dining Tables", "Sofas, Sectionals & Banquets", "Bars", "Highboys, Lowboys & Communals", "Coffee & Accent Tables", "Barstools", "Display Units, Consoles & Sideboards", "Ottomans & Benches", "Dance Floors", "Brandable Items", "Drapery", "Crowd Control", "Groupings"];
const SECTION_SUBS = {"Groupings": ["Soft Seating Groupings", "Dining Groupings", "Highboy Groupings", "Cocktail Table Groupings", "Farm Table Groupings", "Communal Groupings", "Bar Groupings", "Other Groupings"], "Dance Floors": ["Acrylic Dance Floors", "Starlit Dance Floors - Black", "Starlit Dance Floors - White", "Starlit Dance Floors - Zig Zag", "Infinity Dance Floors", "Walnut Wooden Dance Floors", "Other Dance Floors"], "Brandable Items": ["Bars", "Highboys & Tables", "Signage & Displays", "Podiums", "Games & Activities"], "Drapery": ["Lite L'Amour Drapery", "Velour Drapery"]};

let state = { view: 'all', sub: null, query: '', sort: 'name-asc' };
let expandedSecs = new Set();

function fmtPrice(p) {
  if (p === null || p === undefined || p === '') return '—';
  return '$' + Number(p).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
}

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '<ul>';
  html += `<li><a data-view="all" href="#">All Items <span class="count">${ITEMS.length}</span></a></li>`;
  for (const sec of SECTIONS) {
    const count = ITEMS.filter(i => i.s === sec).length;
    if (SECTION_SUBS[sec]) {
      const isExpanded = expandedSecs.has(sec);
      html += `<li class="has-subs">`;
      html += `<a data-view="${sec}" href="#">${sec} <span class="count">${count}</span></a>`;
      html += `<button type="button" class="nav-toggle${isExpanded ? ' expanded' : ''}" data-toggle="${sec}" aria-label="Toggle ${sec} categories">&#9662;</button>`;
      html += `</li>`;
      html += `<ul class="sub-list${isExpanded ? ' expanded' : ''}" data-sublist="${sec}">`;
      for (const g of SECTION_SUBS[sec]) {
        const gcount = ITEMS.filter(i => i.s === sec && i.g === g).length;
        if (gcount === 0) continue;
        html += `<li><a data-view="${sec}" data-sub="${g}" href="#">${g} <span class="count">${gcount}</span></a></li>`;
      }
      html += '</ul>';
    } else {
      html += `<li><a data-view="${sec}" href="#">${sec} <span class="count">${count}</span></a></li>`;
    }
  }
  html += '</ul>';
  nav.innerHTML = html;
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      state.view = a.dataset.view;
      state.sub = a.dataset.sub || null;
      state.query = '';
      document.getElementById('search').value = '';
      if (SECTION_SUBS[a.dataset.view]) expandedSecs.add(a.dataset.view);
      render();
    });
  });
  nav.querySelectorAll('.nav-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const sec = btn.dataset.toggle;
      if (expandedSecs.has(sec)) expandedSecs.delete(sec);
      else expandedSecs.add(sec);
      const sublist = nav.querySelector(`.sub-list[data-sublist="${sec}"]`);
      const isNowExpanded = expandedSecs.has(sec);
      btn.classList.toggle('expanded', isNowExpanded);
      if (sublist) sublist.classList.toggle('expanded', isNowExpanded);
    });
  });
}

function getFiltered() {
  let list = ITEMS;
  const q = state.query.trim().toLowerCase();
  if (q) {
    list = list.filter(i => i.t.toLowerCase().includes(q) || (i.tags && i.tags.toLowerCase().includes(q)));
  } else {
    if (state.view !== 'all') {
      list = list.filter(i => i.s === state.view);
      if (state.sub) list = list.filter(i => i.g === state.sub);
    }
  }
  return list;
}

function sortList(list) {
  const [key, dir] = state.sort.split('-');
  const mult = dir === 'asc' ? 1 : -1;
  return list.slice().sort((a, b) => {
    let av, bv;
    if (key === 'name') { av = a.t.toLowerCase(); bv = b.t.toLowerCase(); }
    else if (key === 'qty') { av = a.q || 0; bv = b.q || 0; }
    else { av = a.p === null || a.p === undefined ? -1 : a.p; bv = b.p === null || b.p === undefined ? -1 : b.p; }
    if (av < bv) return -1 * mult;
    if (av > bv) return 1 * mult;
    return 0;
  });
}

function render() {
  const nav = document.getElementById('nav');
  nav.querySelectorAll('a').forEach(a => {
    const isActive = state.query === '' && a.dataset.view === state.view &&
      ((a.dataset.sub || null) === state.sub);
    a.classList.toggle('active', isActive);
  });

  const title = document.getElementById('section-title');
  const desc = document.getElementById('section-desc');
  if (state.query) {
    title.textContent = `Search results for "${state.query}"`;
    desc.textContent = '';
  } else if (state.view === 'all') {
    title.textContent = 'All Items';
    desc.textContent = 'Every item across all sections.';
  } else if (state.sub) {
    title.textContent = state.sub;
    desc.textContent = state.view + ' — ' + state.sub;
  } else {
    title.textContent = state.view;
    desc.textContent = '';
  }

  let list = getFiltered();
  document.getElementById('resultCount').textContent = list.length + ' item' + (list.length === 1 ? '' : 's');
  list = sortList(list);

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = list.map(i => {
    const imgHtml = i.img
      ? `<img src="${i.img}" loading="lazy" alt="${escapeHtml(i.t)}">`
      : `<div class="noimg">No photo available</div>`;
    const tag = state.query ? `<span class="tag">${i.g ? i.g : i.s}</span>` : '';
    return `
      <div class="card">
        <div class="imgwrap">${imgHtml}</div>
        <div class="body">
          ${tag}
          <div class="title">${escapeHtml(i.t)}</div>
          ${i.dim ? `<div class="dims">${escapeHtml(i.dim)}</div>` : ''}
          <div class="meta">
            <span class="price">${fmtPrice(i.p)}<span style="font-weight:400;color:var(--muted);font-size:11px;">${i.s === 'Drapery' ? '/linear ft' : '/3-day'}</span></span>
            <span class="stock"><span class="dot"></span>${i.q} ${i.s === 'Drapery' ? 'ft in stock' : 'in stock'}</span>
          </div>
          <div class="pid">#${i.id}</div>
          ${i.s === 'Brandable Items' ? `<div class="brand-note">* Branding is priced per sq ft of area branded and varies by item.</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('search').addEventListener('input', (e) => {
  state.query = e.target.value;
  render();
});
document.getElementById('sortSelect').addEventListener('change', (e) => {
  state.sort = e.target.value;
  render();
});

buildNav();
render();
</script>
